[project]
name = "circuits"
version = "0.1.0"
description = "Chaotic attractor simulation via ngspice analog circuits with scipy ODE reference"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "schemdraw[matplotlib]>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
circuits = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
